name: Release

# Cutting a release:
#   1. Bump VERSION in CMakeLists.txt `project(convex VERSION x.y.z ...)`.
#   2. Bump the default client_id ("cpp-x.y.z") in include/convex/client.h —
#      it is the version the backend sees, and the check below can't see it.
#   3. Commit, then tag: git tag vX.Y.Z && git push origin main --tags
# This workflow runs the full CI suite against the tag, checks the tag matches
# the CMake version, and publishes a GitHub Release with generated notes.
# No binary artifacts: consumers use FetchContent/CPM against the tag, and
# GitHub attaches source archives automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches CMake project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version=$(sed -nE 's/^project\(convex VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [ "$tag" != "$cmake_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $cmake_version" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

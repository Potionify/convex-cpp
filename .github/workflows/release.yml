name: Release

# Cutting a release:
#   1. cmake -DBUMP=patch -P scripts/bump_version.cmake   (or minor/major/x.y.z)
#      — bumps include/convex/version.h, commits, and creates the tag.
#   2. git push origin main --tags
# This workflow runs the full CI suite against the tag, checks the tag matches
# the CMake version, and publishes a GitHub Release with generated notes.
# No binary artifacts: consumers use FetchContent/CPM against the tag, and
# GitHub attaches source archives automatically.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches version.h
        run: |
          tag="${GITHUB_REF_NAME#v}"
          get() { sed -nE "s/#define CONVEX_VERSION_$1 ([0-9]+)/\1/p" include/convex/version.h; }
          header_version="$(get MAJOR).$(get MINOR).$(get PATCH)"
          if [ "$tag" != "$header_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.h ($header_version)" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

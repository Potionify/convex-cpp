name: Feature request
description: Suggest an improvement or missing capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If the official convex-js or convex-rs clients already have this, link to it — upstream parity requests are the easiest to accept.
